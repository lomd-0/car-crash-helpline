<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report System - Submit Report</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="Car%20Crash%20Helpline.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="report.html">Submit Report</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="nav-right">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="container">
        <h1>Submit a Report</h1>
        <form>
            <div class="form-group">
                <label for="carPlate">Car Plate Number:</label>
                <input type="text" id="carPlate" name="carPlate" placeholder="e.g., ABC-1234" required>
            </div>

            <div class="form-group">
                <label for="photos">Upload Photos:</label>
                <input type="file" id="photos" name="photos" multiple accept="image/*">
            </div>

            <div class="form-group">
                <label for="description">Description of Incident:</label>
                <textarea id="description" name="description" placeholder="Please describe what happened..." required></textarea>
            </div>

            <div class="form-group">
                <label for="location">Location:</label>
                <input type="text" id="location" name="location" placeholder="Where did this occur?" required>
            </div>

            <div class="form-group">
                <label for="comments">Additional Comments:</label>
                <textarea id="comments" name="comments" placeholder="Any additional information..."></textarea>
            </div>

            <button type="submit">Submit Report</button>
        </form>
    </main>
</body>
</html>
