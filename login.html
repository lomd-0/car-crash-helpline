<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report System - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="Car%20Crash%20Helpline.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="report.html">Submit Report</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="nav-right">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" name="loginEmail" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required>
            </div>

            <div id="loginStatus" class="status-message" aria-live="polite"></div>
            <button type="submit">Login</button>
        </form>
    </main>

    <script src="login-validation.js"></script>
</body>
</html>
