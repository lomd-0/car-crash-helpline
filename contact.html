<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report System - Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="Car%20Crash%20Helpline.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="report.html">Submit Report</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="nav-right">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <main class="container">
        <h1>Contact Us</h1>
        <form>
            <div class="form-group">
                <label for="contactName">Name:</label>
                <input type="text" id="contactName" name="contactName" required>
            </div>

            <div class="form-group">
                <label for="contactEmail">Email:</label>
                <input type="email" id="contactEmail" name="contactEmail" required>
            </div>

            <div class="form-group">
                <label for="contactMessage">Message:</label>
                <textarea id="contactMessage" name="contactMessage" placeholder="Your message..." required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-info">
            <p><strong>Email:</strong> info@reportsystem.com</p>
            <p><strong>Phone:</strong> +1 (555) 123-4567</p>
            <p><strong>Address:</strong> 123 Safety Street, City, State 12345</p>
        </div>
    </main>
</body>
</html>
